name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", "web/min-native.txt", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bundle the MP3 encoder (lamejs, LGPL)
        run: |
          mkdir -p web/vendor
          curl -fsSL https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js -o web/vendor/lame.min.js
          node -e "const fs=require('fs'); new Function(fs.readFileSync('web/vendor/lame.min.js','utf8')+';this.L=lamejs;').call(globalThis); const e=new L.Mp3Encoder(2,48000,320); const z=new Int16Array(1152); const b=e.encodeBuffer(z,z); console.log('lamejs ok', b.length>=0)"
      - name: Stamp the interface version
        run: |
          echo "{\"sha\":\"$GITHUB_SHA\",\"time\":$(git log -1 --format=%ct),\"minNative\":$(cat web/min-native.txt)}" > web/version.json
          cat web/version.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: cabin-q-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as the "latest" download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk cabin-q.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest cabin-q.apk \
            --title "Cabin Q · latest build" \
            --notes "Build #${{ github.run_number }} from ${GITHUB_SHA::7}. Download cabin-q.apk on your phone and install it." \
            --prerelease

      - name: Tell the installed apps (via the web site) that a new build exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -R ${{ github.repository }}
