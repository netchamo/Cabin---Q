name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", "web/min-native.txt", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the interface version
        run: |
          echo "{\"sha\":\"$GITHUB_SHA\",\"time\":$(git log -1 --format=%ct),\"minNative\":$(cat web/min-native.txt)}" > web/version.json
          cat web/version.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: cabin-q-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as the "latest" download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk cabin-q.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest cabin-q.apk \
            --title "Cabin Q · latest build" \
            --notes "Build #${{ github.run_number }} from ${GITHUB_SHA::7}. Download cabin-q.apk on your phone and install it." \
            --prerelease
