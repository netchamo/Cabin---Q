name: Web app (iPhone)

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Bundle the MP3 encoder (lamejs, LGPL)
        run: |
          mkdir -p web/vendor
          curl -fsSL https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js -o web/vendor/lame.min.js
          node -e "const fs=require('fs'); new Function(fs.readFileSync('web/vendor/lame.min.js','utf8')+';this.L=lamejs;').call(globalThis); const e=new L.Mp3Encoder(2,48000,320); const z=new Int16Array(1152); const b=e.encodeBuffer(z,z); console.log('lamejs ok', b.length>=0)"
      - name: Stamp the interface version
        run: |
          echo "{\"sha\":\"$GITHUB_SHA\",\"time\":$(git log -1 --format=%ct),\"minNative\":$(cat web/min-native.txt)}" > web/version.json
          cat web/version.json
      - name: Publish the latest Android build number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api repos/${{ github.repository }}/releases/tags/latest --jq '.body' | grep -o 'Build #[0-9]*' | grep -o '[0-9]*' || echo 0)
          echo "{\"build\":${n:-0}}" > web/apk.json
          cat web/apk.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
